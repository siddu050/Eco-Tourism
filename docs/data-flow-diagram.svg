<svg width="1700" height="1100" viewBox="0 0 1700 1100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Indian Journeys Data Flow Diagram</title>
  <desc id="desc">Short data flow diagram for the Indian Journeys app showing authentication, location browsing, smart booking, payment, reviews, and admin management.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1620" y2="1020" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F2E8"/>
      <stop offset="0.52" stop-color="#ECF6F2"/>
      <stop offset="1" stop-color="#E8EFF8"/>
    </linearGradient>
    <linearGradient id="hero" x1="70" y1="65" x2="1620" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E685A"/>
      <stop offset="1" stop-color="#1A4168"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14V0Z" fill="#2E5B8A"/>
    </marker>
    <marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14V0Z" fill="#1E685A"/>
    </marker>
    <style>
      .title { font: 700 38px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #D8E6F2; }
      .chip { font: 700 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.2px; fill: #D5F1E5; }
      .entity { fill: rgba(255,255,255,0.84); stroke: #D0DDE7; stroke-width: 2; }
      .process { fill: #FFFFFF; stroke: #8FB8D3; stroke-width: 2; }
      .processGreen { fill: #FFFFFF; stroke: #8FC2B3; stroke-width: 2; }
      .store { fill: #FDFEFF; stroke: #B8CCE5; stroke-width: 2; }
      .ext { fill: #FFFFFF; stroke: #D5C083; stroke-width: 2; }
      .label { font: 700 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.3px; fill: #5A728A; }
      .boxTitle { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #16324D; }
      .boxText { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #4B657D; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #637C93; }
      .flow { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #1E4F79; }
      .flowTeal { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #1D6557; }
      .footer { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #516A82; }
      .step { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #1E685A; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1700" height="1100" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="126" fill="#FFFFFF" fill-opacity="0.22"/>
  <circle cx="1575" cy="930" r="190" fill="#FFFFFF" fill-opacity="0.18"/>
  <circle cx="1475" cy="150" r="96" fill="#F0D9A7" fill-opacity="0.22"/>

  <rect x="70" y="65" width="1560" height="132" rx="28" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="112" y="113" class="chip">INDIAN JOURNEYS ECO-TOURISM APP</text>
  <text x="112" y="157" class="title">Short Data Flow Diagram</text>
  <text x="112" y="187" class="subtitle">Shows how user input moves through authentication, location search, booking, payment, favorites, reviews, and admin management.</text>

  <rect x="55" y="245" width="220" height="144" rx="26" class="entity" filter="url(#shadow)"/>
  <text x="85" y="290" class="label">EXTERNAL ENTITY</text>
  <text x="85" y="326" class="boxTitle">Traveler</text>
  <text x="85" y="354" class="boxText">Searches places, books trips, pays, saves favorites, and writes reviews.</text>

  <rect x="55" y="520" width="220" height="144" rx="26" class="entity" filter="url(#shadow)"/>
  <text x="85" y="565" class="label">EXTERNAL ENTITY</text>
  <text x="85" y="601" class="boxTitle">Admin</text>
  <text x="85" y="629" class="boxText">Reads overview data and updates locations, bookings, and reviews.</text>

  <rect x="335" y="235" width="250" height="160" rx="26" class="processGreen" filter="url(#shadow)"/>
  <text x="365" y="276" class="step">STEP 1</text>
  <text x="365" y="312" class="boxTitle">Auth and Session</text>
  <text x="365" y="340" class="boxText">Register / login</text>
  <text x="365" y="367" class="boxText">JWT created and checked</text>
  <text x="365" y="394" class="small">Token and username go to browser storage.</text>

  <rect x="640" y="235" width="250" height="160" rx="26" class="process" filter="url(#shadow)"/>
  <text x="670" y="276" class="step">STEP 2</text>
  <text x="670" y="312" class="boxTitle">Browse Locations</text>
  <text x="670" y="340" class="boxText">Search by query, state, and price</text>
  <text x="670" y="367" class="boxText">View destination details + reviews</text>
  <text x="670" y="394" class="small">Frontend receives location cards and review lists.</text>

  <rect x="945" y="235" width="250" height="182" rx="26" class="process" filter="url(#shadow)"/>
  <text x="975" y="276" class="step">STEP 3</text>
  <text x="975" y="312" class="boxTitle">Smart Booking</text>
  <text x="975" y="340" class="boxText">Traveler chooses dates, guests, and services</text>
  <text x="975" y="367" class="boxText">Frontend calculates distance-aware pricing</text>
  <text x="975" y="394" class="small">Booking payload sends total price and pricing breakdown to the API.</text>

  <rect x="1245" y="235" width="335" height="208" rx="26" class="ext" filter="url(#shadow)"/>
  <text x="1275" y="276" class="label">BROWSER-SIDE HELPERS</text>
  <text x="1275" y="312" class="boxTitle">External Services</text>
  <text x="1275" y="340" class="boxText">Geolocation provides live coordinates.</text>
  <text x="1275" y="367" class="boxText">Google Maps opens route and nearby searches.</text>
  <text x="1275" y="394" class="boxText">QuickChart builds QR code image for UPI.</text>
  <text x="1275" y="421" class="boxText">UPI app receives the payment intent link.</text>

  <rect x="335" y="515" width="250" height="182" rx="26" class="processGreen" filter="url(#shadow)"/>
  <text x="365" y="556" class="step">STEP 4</text>
  <text x="365" y="592" class="boxTitle">Payment and My Trips</text>
  <text x="365" y="620" class="boxText">Booking confirmation loads trip record</text>
  <text x="365" y="647" class="boxText">Traveler marks paid or cancels</text>
  <text x="365" y="674" class="small">Payment status changes from pending to paid or refund_pending.</text>

  <rect x="640" y="515" width="250" height="182" rx="26" class="process" filter="url(#shadow)"/>
  <text x="670" y="556" class="step">STEP 5</text>
  <text x="670" y="592" class="boxTitle">Favorites and Reviews</text>
  <text x="670" y="620" class="boxText">Save favorite places</text>
  <text x="670" y="647" class="boxText">Submit ratings and comments</text>
  <text x="670" y="674" class="small">Destination pages refresh social proof from stored review data.</text>

  <rect x="945" y="515" width="250" height="182" rx="26" class="processGreen" filter="url(#shadow)"/>
  <text x="975" y="556" class="step">STEP 6</text>
  <text x="975" y="592" class="boxTitle">Admin Console</text>
  <text x="975" y="620" class="boxText">Read overview metrics and lists</text>
  <text x="975" y="647" class="boxText">Update locations and bookings</text>
  <text x="975" y="674" class="small">Delete reviews and monitor user activity counts.</text>

  <rect x="335" y="780" width="1245" height="200" rx="28" class="store" filter="url(#shadow)"/>
  <text x="370" y="828" class="label">DATA STORE</text>
  <text x="370" y="868" class="boxTitle">SQLite `tourism.db`</text>
  <text x="370" y="900" class="boxText">Tables keep the durable state for the app:</text>
  <text x="370" y="932" class="boxText">Users, Locations, Bookings, Favorites, Reviews</text>
  <text x="370" y="964" class="small">Every protected API call reads the JWT-backed user, loads records through SQLAlchemy, and writes confirmed changes back to the same local database.</text>

  <path d="M275 305H335" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="284" y="290" class="flow">credentials</text>

  <path d="M585 315H640" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="593" y="300" class="flow">token allows protected calls</text>

  <path d="M275 325C300 325 305 325 335 325" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M460 395V780" stroke="#1E685A" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="474" y="620" class="flowTeal">users table</text>

  <path d="M275 350C410 350 485 315 640 315" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="435" y="298" class="flow">search filters, open location</text>

  <path d="M765 395V780" stroke="#1E685A" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="779" y="620" class="flowTeal">locations + reviews</text>

  <path d="M890 315H945" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="902" y="300" class="flow">selected destination</text>

  <path d="M1195 325H1245" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1203" y="310" class="flow">maps, QR, UPI helpers</text>

  <path d="M1070 417V780" stroke="#1E685A" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="1084" y="620" class="flowTeal">bookings</text>

  <path d="M460 515C460 450 875 450 875 326" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="608" y="440" class="flow">booking id and trip details</text>

  <path d="M275 585H335" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="285" y="570" class="flow">pay, cancel, trip history</text>

  <path d="M275 610C420 610 475 606 640 606" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="425" y="590" class="flow">favorite and review data</text>

  <path d="M765 697V780" stroke="#1E685A" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="779" y="748" class="flowTeal">favorites + reviews</text>

  <path d="M275 635C430 635 575 606 945 606" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="560" y="650" class="flow">admin requests and updates</text>

  <path d="M1070 697V780" stroke="#1E685A" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="1084" y="748" class="flowTeal">all managed records</text>

  <path d="M1245 390C1180 390 1160 430 1120 515" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1188" y="468" class="flow">QR + UPI flow</text>

  <path d="M1245 336C1180 336 1155 315 1195 315" stroke="#2E5B8A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1185" y="296" class="flow">geolocation + maps</text>

  <rect x="70" y="1020" width="1560" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.84" stroke="#D5E0EA"/>
  <text x="98" y="1044" class="footer">Simple story: authenticate the traveler, fetch destinations, create a booking with pricing details, update payment status, store favorites and reviews, and let admins manage the same shared data store.</text>
</svg>
